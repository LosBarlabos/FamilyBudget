<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1525" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Családi költségvetés</title>
    <script>
      // A kézzel választott téma még az első megjelenítés előtt, hogy ne villanjon (ugyanezt teszi az applyTheme,
      // src/ui/components/common.tsx). A mintaadatos fejlesztői mód saját kulccsal tárol (localStore.ts).
      try {
        var key = (sessionStorage.getItem('minta') === '1' ? 'minta:' : '') + 'theme';
        var t = JSON.parse(localStorage.getItem(key) || '"system"');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.dataset.media = m.media;
            m.media = '';
            m.content = t === 'dark' ? '#0e1525' : '#f4f6f9';
          });
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
